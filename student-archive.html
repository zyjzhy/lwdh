            function markPreviewStale() {
                if (!preview || preview.stale) return;
                preview.stale = true;
                updatePreviewButtons();
                setStatus('学生信息或档案设置已变更，请重新生成预览。', 'warning', previewStatus);

                input.setCustomValidity(message);

            async function exportExcel() {
                if (exportExcelBtn.disabled) return;
                collectPreviewEdits();
                const current = preview;
                exporting = true;
                updatePreviewButtons();
                setStatus('正在准备 Excel 文件…', 'info', previewStatus);

                try {
                    const xlsx = await loadLibrary('XLSX');
                    if (preview !== current || current.stale) return;
                    const wb = xlsx.utils.book_new();
                    const ws = xlsx.utils.aoa_to_sheet(current.data);
                    ws['!merges'] = [{s: {r: 0, c: 0}, e: {r: 0, c: 30}}];
                    ws['!cols'] = current.data[1].map(() => ({width: 20}));
                    ws['!rows'] = [{hpx: 80}];
                    xlsx.utils.book_append_sheet(wb, ws, '模板');

                    const fileName = `学生档案模板_${current.year}_${current.degree}_${current.students}人.xlsx`;
                    xlsx.writeFile(wb, fileName);
                    setStatus(`已导出 ${fileName}`, 'success', previewStatus);
                } catch {
                    if (preview === current && !current.stale) {
                        setStatus('导出失败，请检查网络后重试。', 'error', previewStatus);
                    }
                } finally {
                    exporting = false;
                    updatePreviewButtons();
                }
            }

            function clearContent() {
                namesTextarea.value = '';
                topicsTextarea.value = '';
                for (const view of uploadViews.values()) {
                    view.records = [];
                    view.pagesByStudent.clear();
                    view.results.hidden = true;
                    view.stats.hidden = true;
                    view.progress.hidden = true;
                    view.fileList.replaceChildren();
                    view.results.querySelectorAll('.issue-list').forEach(group => { group.hidden = true; });
                }
                preview = null;
                previewTable.replaceChildren();
                previewSection.hidden = true;
                updatePreviewButtons();
                updateStatus();
                namesTextarea.focus();
            }

            function onEntryChange() {
                markPreviewStale();
                updateStatus();
                if (!processingCount) {
                    uploadViews.forEach(view => {
                        if (view.records.length) renderUploadSummary(view);
                    });
                }
            }

            createPageSettingsTable();
            createFileUploadTabs();
            setTodayDate();
            updateStatus();

            namesTextarea.addEventListener('input', onEntryChange);
            topicsTextarea.addEventListener('input', onEntryChange);
            [yearInput, degreeSelect, dateInput, pageSettingsBody].forEach(element => {
                element.addEventListener('input', event => {
                    event.target.removeAttribute('aria-invalid');
                    event.target.setCustomValidity('');
                    markPreviewStale();
                    updateStatus();
                });
            });

            pageSettingsBody.addEventListener('focusout', ({target}) => {
                if (target instanceof HTMLInputElement && (!target.value || !target.validity.valid)) {
                    target.value = target.defaultValue;
                }
            });

            generateBtn.addEventListener('click', showPreview);
            clearBtn.addEventListener('click', clearContent);
            updateTemplateBtn.addEventListener('click', () => {
                collectPreviewEdits();
                setStatus('模板修改已应用，可导出 Excel。', 'success', previewStatus);
            });
            exportExcelBtn.addEventListener('click', exportExcel);
            document.getElementById('close-manual-modal').addEventListener('click', () => manualPagesModal.close());
            document.getElementById('cancel-manual-pages').addEventListener('click', () => manualPagesModal.close());
            manualPagesForm.addEventListener('submit', saveManualPages);
        });
    </script>
</body>
</html>
